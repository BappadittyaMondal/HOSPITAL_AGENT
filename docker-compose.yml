version: '3.8'

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: hospital_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hospital_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospital_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-hospital_main}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital_admin} -d ${POSTGRES_DB:-hospital_main}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hospital_network

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: hospital_event_broker
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital_network

  redis:
    image: redis:7.4-alpine
    container_name: hospital_redis_cache
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass_2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hospital_network

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-32Z
    container_name: hospital_object_store
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hospital_s3_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hospital_s3_secret_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital_network

  orthanc:
    image: orthancteam/orthanc:24.7.3
    container_name: hospital_pacs_server
    restart: unless-stopped
    environment:
      ORTHANC__NAME: "HOSPITAL_CORE_PACS"
      ORTHANC__STORAGE_DIRECTORY: "/var/lib/orthanc/db"
      ORTHANC__DICOM_PORT: "4242"
      ORTHANC__HTTP_PORT: "8042"
      ORTHANC__REGISTERED_USERS: '{"pacsadmin":"pacs_secure_2026"}'
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__DICOM_WEB__ENABLE: "true"
    ports:
      - "4242:4242"
      - "8042:8042"
    volumes:
      - orthancdata:/var/lib/orthanc/db
    networks:
      - hospital_network

  safety-engine:
    build:
      context: ./services/safety-engine
      dockerfile: Dockerfile
    container_name: hospital_safety_engine
    restart: unless-stopped
    environment:
      PORT: 50051
      ENVIRONMENT: production
      LOG_LEVEL: info
    ports:
      - "50051:50051"
    networks:
      - hospital_network

  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: hospital_core_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      safety-engine:
        condition: service_started
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-hospital_admin}:${POSTGRES_PASSWORD:-hospital_secure_password_2026}@postgres:5432/${POSTGRES_DB:-hospital_main}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
      SAFETY_ENGINE_GRPC: safety-engine:50051
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    networks:
      - hospital_network

  ai-orchestrator:
    build:
      context: ./services/ai-orchestrator
      dockerfile: Dockerfile
    container_name: hospital_ai_orchestrator
    restart: unless-stopped
    depends_on:
      - redis
      - safety-engine
    environment:
      PORT: 8000
      SAFETY_ENGINE_URL: http://safety-engine:50051
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_2026}
    ports:
      - "8000:8000"
    networks:
      - hospital_network

networks:
  hospital_network:
    driver: bridge

volumes:
  pgdata:
  redpandadata:
  redisdata:
  miniodata:
  orthancdata:
