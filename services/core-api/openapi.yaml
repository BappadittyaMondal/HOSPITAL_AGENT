openapi: 3.1.0
info:
  title: HOSPITAL Core Platform API
  description: Zero-Trust End-to-End Hospital Information System (HIS) API
  version: 1.0.0
  contact:
    name: Hospital Platform Architecture Group
servers:
  - url: /api/v1
    description: Core API v1 Production Endpoint

paths:
  /health:
    get:
      summary: Service Health & Readiness Probe
      operationId: getHealthStatus
      responses:
        '200':
          description: Service is healthy and connected to DB/Redis
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp, version, services]
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                  services:
                    type: object
                    required: [postgres, redis, safety_engine]
                    properties:
                      postgres:
                        type: string
                      redis:
                        type: string
                      safety_engine:
                        type: string

  /auth/token:
    post:
      summary: Authenticate Clinical Staff & Issue Contextual JWT
      operationId: authenticateStaff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, tenant_id]
              properties:
                username:
                  type: string
                password:
                  type: string
                tenant_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_in, role, permissions]
                properties:
                  token:
                    type: string
                  expires_in:
                    type: integer
                  role:
                    type: string
                  permissions:
                    type: array
                    items:
                      type: string

  /safety/evaluate-order:
    post:
      summary: Sub-millisecond DRE Clinical Safety Verification
      operationId: evaluateClinicalOrder
      parameters:
        - in: header
          name: X-Tenant-ID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, clinician_id, order_type, items]
              properties:
                patient_id:
                  type: string
                  format: uuid
                clinician_id:
                  type: string
                  format: uuid
                order_type:
                  type: string
                  enum: [MEDICATION, LAB, RADIOLOGY, PROCEDURE]
                items:
                  type: array
                  items:
                    type: object
                    required: [code, name]
                    properties:
                      code:
                        type: string
                      name:
                        type: string
                      dose:
                        type: string
                      route:
                        type: string
      responses:
        '200':
          description: Safety evaluation result
          content:
            application/json:
              schema:
                type: object
                required: [status, hard_stops, warnings, evaluated_in_microseconds]
                properties:
                  status:
                    type: string
                    enum: [APPROVED, BLOCKED, WARNING_REQUIRES_OVERRIDE]
                  hard_stops:
                    type: array
                    items:
                      type: object
                      required: [rule_id, message, severity]
                      properties:
                        rule_id:
                          type: string
                        message:
                          type: string
                        severity:
                          type: string
                  warnings:
                    type: array
                    items:
                      type: object
                      properties:
                        rule_id:
                          type: string
                        message:
                          type: string
                  evaluated_in_microseconds:
                    type: number

  /triage/history-intake:
    post:
      summary: Structured Branching History Intake & Red Flag Elicitation
      operationId: processStructuredHistoryIntake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, patient_id, chief_complaint, answers]
              properties:
                session_id:
                  type: string
                patient_id:
                  type: string
                chief_complaint:
                  type: string
                patient_age:
                  type: integer
                is_female:
                  type: boolean
                is_pregnant:
                  type: boolean
                answers:
                  type: object
      responses:
        '200':
          description: History intake session processed with red flags and pertinent signs
          content:
            application/json:
              schema:
                type: object
                required: [session_id, patient_id, active_red_flags, pertinent_positives, pertinent_negatives]

  /triage/syndromic-holding-plan:
    post:
      summary: Formulate 5-10h Pre-Hospital Supportive Care Plan across 8 Syndromic Archetypes
      operationId: generateSyndromicHoldingPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, syndrome, vitals]
              properties:
                patient_id:
                  type: string
                syndrome:
                  type: string
                patient_age:
                  type: integer
                is_female:
                  type: boolean
                patient_weight_kg:
                  type: number
                vitals:
                  type: object
                current_medications:
                  type: array
                  items:
                    type: string
                known_allergies:
                  type: array
                  items:
                    type: string
                is_pregnant:
                  type: boolean
                estimated_transit_hours:
                  type: number
      responses:
        '200':
          description: Safe pre-hospital holding care plan with DRE-validated supportive bridge orders
          content:
            application/json:
              schema:
                type: object
                required: [plan_id, patient_id, syndrome, urgency_tier, supportive_medications, inviolable_blacklists]

  /clinical/emergency-scores:
    post:
      summary: Compute Clinical Emergency Scores (GCS, FAST, Pediatric, Anaphylaxis, Burns)
      operationId: computeEmergencyScore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score_type]
              properties:
                score_type:
                  type: string
                  enum: [GCS, FAST, PEDIATRIC, ANAPHYLAXIS, BURNS, BURNS_PARKLAND]
      responses:
        '200':
          description: Emergency score computation result with non-bypassable clinical alerts
          content:
            application/json:
              schema:
                type: object
